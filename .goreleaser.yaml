# GoReleaser v2 — builds the release archives for .github/workflows/release.yml
# Local dry run (no publishing):  goreleaser release --snapshot --clean
version: 2
project_name: android-tui

builds:
  - id: android-tui
    main: .
    binary: android-tui
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/madushas/android-tui/internal/core.Version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}" # reproducible archives
    # Linux and macOS only: the code uses Unix-only syscalls (Windows/FreeBSD do not build).
    goos: [linux, darwin]
    goarch: [amd64, arm64]

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - completions/*

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  prerelease: auto # v0.1.0-rc1 style tags become pre-releases
