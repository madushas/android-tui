name: Release

# Push a tag like v0.1.0 to publish a GitHub release with binaries and checksums.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # GoReleaser builds the changelog from the git history
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: verify before publishing
        run: |
          make fmt-check
          go vet ./...
          go test -count=1 ./...
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
